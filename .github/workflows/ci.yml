name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.17.3
    with:
      # coverage_threshold: backend/frontendはvitest --coverageでcoverage-summary.jsonを
      # 出力する構成のため、dev-standards標準のcheck-coverage-threshold複合actionで80%を
      # 下回った場合にCIを失敗させる。piはnode --testのみでdev-standards側もカバレッジ計測が
      # 標準化されていないため、c8（node --testラッパー）による試験導入としてyoutube-radar
      # 固有にistanbul形式のcoverage-summary.jsonを出力させている（Issue #82）。piのテストを
      # 追加し4指標すべて80%以上（実測: stmts/lines 100%、branch 97.82%、funcs 100%）まで
      # 引き上げたため、閾値もbackend/frontendと同じ80%にした（Issue #83）
      packages: '[{"dir":"backend","coverage_threshold":80},{"dir":"pi","coverage_threshold":80},{"dir":"frontend","build":true,"node_version":22,"coverage_threshold":80}]'
      node_version: 20
      # frontendがdev-standardsのshared/ui配下をsymlink経由で参照するため、
      # package-testジョブでもdev-standardsサブモジュールをチェックアウトする必要がある
      enable_standards_check: true
      # enable_e2e_test: frontend-e2e-testジョブ（Playwright）を有効化する。この入力は
      # packages（matrix構成）と排他ではなく独立して制御されるため両立できる。
      # frontend_dirは既定値"frontend"のままでこのリポジトリのfrontendディレクトリと一致する
      # （Issue #87）
      enable_e2e_test: true
      # e2e_coverage_threshold: frontend-e2e-testジョブ自体のE2Eテストカバレッジ
      # （ユニットテストのcoverage_thresholdとは別軸、Issue #135）。開発共通標準の
      # 最終目標は80%以上だが、一度に到達せずラチェット方式で段階的に引き上げる
      # （Issue #157）。VITE_TRANSCRIPT_API_BASE_URLをE2Eビルドでもダミー値で
      # 有効化し、タグ表示・タグ絞り込み（Issue #126）をE2Eで検証するテストを
      # 追加した結果、実測値がlines 76.93%→80.45%・statements 79.14%→81.48%・
      # functions 73.33%→82.56%・branches 54.55%→62.50%へ向上した。最も低い
      # 実測値（branches 62.50%）に対しわずかな余裕を持たせた60を設定する
      e2e_coverage_threshold: 60
      # enable_duplication_check: jscpdによるコード重複検知（Issue #134）。dev-standards標準の
      # ラチェット方式（docs/nextjs-static-lambda-pattern.md「jscpd/E2Eカバレッジの閾値設定」）に
      # 従い、duplication_threshold未設定（0、レポート表示のみ）でCIを実行し実測値を確認した
      # ところ、重複0件（0.00%）だった（PR #143）。実測値ちょうどを閾値にすると些細な重複の
      # 発生で即座にCIが赤くなるため、実測値に対しわずかな余裕を持たせたラチェット値として
      # 2%を設定する（dev-standards他プロダクトの実例と同じ値）
      enable_duplication_check: true
      duplication_threshold: 2
      # enable_text_lint/text_lint_paths: textlint（textlint-rule-preset-ja-technical-writing）
      # によるMarkdown文書チェック（Issue #153）。共有設定（textlint.config.cjs・
      # .textlintignore）はdev-standardsからsymlink配布済み
      enable_text_lint: true
      text_lint_paths: "docs/*.md\nREADME.md\nCLAUDE.md\n.claude/skills/**/*.md"
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

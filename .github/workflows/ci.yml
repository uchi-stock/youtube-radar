name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.7.3
    with:
      # coverage_threshold: backend/frontendはvitest --coverageでcoverage-summary.jsonを
      # 出力する構成のため、dev-standards標準のcheck-coverage-threshold複合actionで80%を
      # 下回った場合にCIを失敗させる。piはnode --testのみでdev-standards側もカバレッジ計測が
      # 標準化されていないため、c8（node --testラッパー）による試験導入としてyoutube-radar
      # 固有にistanbul形式のcoverage-summary.jsonを出力させている（Issue #82）。piは現状の
      # 実測分岐カバレッジ（71.42%）が80%に届いていないため、閾値はまず70%から開始する
      # （80%への引き上げはIssue #83で追跡）
      packages: '[{"dir":"backend","coverage_threshold":80},{"dir":"pi","coverage_threshold":70},{"dir":"frontend","build":true,"node_version":22,"coverage_threshold":80}]'
      node_version: 20
      # frontendがdev-standardsのshared/ui配下をsymlink経由で参照するため、
      # package-testジョブでもdev-standardsサブモジュールをチェックアウトする必要がある
      enable_standards_check: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

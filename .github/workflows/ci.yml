name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.9.0
    with:
      # coverage_threshold: backend/frontendはvitest --coverageでcoverage-summary.jsonを
      # 出力する構成のため、dev-standards標準のcheck-coverage-threshold複合actionで80%を
      # 下回った場合にCIを失敗させる。piはnode --testのみでdev-standards側もカバレッジ計測が
      # 標準化されていないため、c8（node --testラッパー）による試験導入としてyoutube-radar
      # 固有にistanbul形式のcoverage-summary.jsonを出力させている（Issue #82）。piは現状の
      # 実測分岐カバレッジ（71.42%）が80%に届いていないため、閾値はまず70%から開始する
      # （80%への引き上げはIssue #83で追跡）
      packages: '[{"dir":"backend","coverage_threshold":80},{"dir":"pi","coverage_threshold":70},{"dir":"frontend","build":true,"node_version":22,"coverage_threshold":80}]'
      node_version: 20
      # frontendがdev-standardsのshared/ui配下をsymlink経由で参照するため、
      # package-testジョブでもdev-standardsサブモジュールをチェックアウトする必要がある
      enable_standards_check: true
      # enable_e2e_test: frontend-e2e-testジョブ（Playwright）を有効化する。この入力は
      # packages（matrix構成）と排他ではなく独立して制御されるため両立できる。
      # frontend_dirは既定値"frontend"のままでこのリポジトリのfrontendディレクトリと一致する
      # （Issue #87）
      enable_e2e_test: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      # frontend-e2e-testジョブ（Playwright）へ、ログイン〜チャンネル一覧表示のE2Eで使う
      # backend用のGoogle OAuth secretsを渡す。対話的な同意画面はPlaywrightで自動操作
      # できないため、これらから実際に交換したアクセストークンをブラウザへ注入し、その先の
      # YouTube Data API/userinfo APIへは実際のAPIへ直結させる（Issue #88、
      # dev-standards側の対応はbamiyanapp/dev-standards#371）
      E2E_SECRETS_JSON: |
        {"GOOGLE_OAUTH_CLIENT_ID":"${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}","GOOGLE_OAUTH_CLIENT_SECRET":"${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}","GOOGLE_OAUTH_REFRESH_TOKEN":"${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}"}

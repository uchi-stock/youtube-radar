name: Invoke Pipeline (manual)

on:
  workflow_dispatch:

jobs:
  invoke:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Invoke Lambda and capture full CloudWatch Logs
        run: |
          START_EPOCH_MS=$(($(date +%s%N) / 1000000))

          aws lambda invoke \
            --function-name youtube-radar-pipeline-dev-pipeline \
            --cli-read-timeout 300 \
            response.json > invoke-result.json

          # ログがCloudWatchへ反映されるまでの遅延を吸収する
          sleep 15

          {
            echo '## Lambda invoke result'
            echo '### Response'
            echo '```json'
            cat response.json
            echo '```'
            echo '### Logs (CloudWatch, full)'
            echo '```'
            aws logs filter-log-events \
              --log-group-name /aws/lambda/youtube-radar-pipeline-dev-pipeline \
              --start-time "$START_EPOCH_MS" \
              --query 'events[].message' \
              --output text
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

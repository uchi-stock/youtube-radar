name: Invoke Pipeline (manual)

on:
  workflow_dispatch:

jobs:
  invoke:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: Invoke discover and transcriptWorker, capture full CloudWatch Logs
        run: |
          invoke_and_report() {
            local function_name="$1"
            local response_file="$2"

            local start_epoch_ms
            start_epoch_ms=$(($(date +%s%N) / 1000000))

            aws lambda invoke \
              --function-name "$function_name" \
              --cli-read-timeout 300 \
              "$response_file" > "${response_file}.invoke-result.json"

            # ログがCloudWatchへ反映されるまでの遅延を吸収する
            sleep 15

            {
              echo "## ${function_name} invoke result"
              echo '### Response'
              echo '```json'
              cat "$response_file"
              echo '```'
              echo '### Logs (CloudWatch, full)'
              echo '```'
              aws logs filter-log-events \
                --log-group-name "/aws/lambda/${function_name}" \
                --start-time "$start_epoch_ms" \
                --query 'events[].message' \
                --output text
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          }

          invoke_and_report youtube-radar-pipeline-dev-discover discover-response.json
          invoke_and_report youtube-radar-pipeline-dev-transcriptWorker transcript-worker-response.json

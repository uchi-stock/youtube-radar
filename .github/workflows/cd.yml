name: CD

on:
  push:
    branches: [main]

jobs:
  cd:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v2.7.3
    with:
      enable_release: true
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  deploy-backend:
    needs: cd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v2.7.3
        with:
          working-directory: backend
          node-version: "22"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}

  deploy-frontend:
    # 動画詳細（GET /videos/{videoId}）のAPIエンドポイントURLをbackendのCloudFormation Outputsから
    # 取得してビルドに渡すため、backendのデプロイ完了を待つ
    needs: [cd, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      # frontendがdev-standardsのshared/ui配下をsymlink経由で参照するため、
      # サブモジュールをチェックアウトしないとビルド時にsymlinkが解決できない
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v2.7.3
        with:
          working-directory: frontend
          node-version: "22"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Get transcript API base URL
        id: transcript_api
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-1
        run: |
          url=$(aws cloudformation describe-stacks \
            --stack-name youtube-radar-pipeline-dev \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" \
            --output text)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Client IDは秘密情報ではないため、既存のバックエンド用Secretをそのまま流用する
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          # HttpApiUrlも秘密情報ではない（読み取り専用の公開エンドポイントのURL）
          VITE_TRANSCRIPT_API_BASE_URL: ${{ steps.transcript_api.outputs.url }}
      - name: Sync to S3 and invalidate CloudFront
        working-directory: frontend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-1
        run: |
          bucket_name=$(aws cloudformation describe-stacks \
            --stack-name youtube-radar-frontend-dev \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          distribution_id=$(aws cloudformation describe-stacks \
            --stack-name youtube-radar-frontend-dev \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          aws s3 sync dist/ "s3://${bucket_name}/" --delete --cache-control "no-cache" --exclude "assets/*"
          aws s3 sync dist/assets/ "s3://${bucket_name}/assets/" --cache-control "public, max-age=31536000, immutable"
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths "/*"

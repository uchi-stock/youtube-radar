name: CD

on:
  push:
    branches: [main]

jobs:
  cd:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v2.7.3
    with:
      enable_release: true
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  deploy-backend:
    needs: cd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v2.7.3
        with:
          working-directory: backend
          node-version: "22"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PI_API_KEY: ${{ secrets.PI_API_KEY }}

service: youtube-radar-pipeline
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1
  environment:
    PROCESSED_VIDEOS_TABLE: ${self:service}-${sls:stage}-processed-videos
    YOUTUBE_API_KEY: ${env:YOUTUBE_API_KEY}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
    GOOGLE_OAUTH_CLIENT_ID: ${env:GOOGLE_OAUTH_CLIENT_ID}
    GOOGLE_OAUTH_CLIENT_SECRET: ${env:GOOGLE_OAUTH_CLIENT_SECRET}
    GOOGLE_OAUTH_REFRESH_TOKEN: ${env:GOOGLE_OAUTH_REFRESH_TOKEN}
    LINE_CHANNEL_ACCESS_TOKEN: ${env:LINE_CHANNEL_ACCESS_TOKEN, ''}
    LINE_USER_ID: ${env:LINE_USER_ID, ''}
    # 429（アクセス制限）発生時のリトライ上限・待機時間のベース値。実際の429発生状況を見ながら調整する。
    TRANSCRIPT_RETRY_MAX: ${env:TRANSCRIPT_RETRY_MAX, '2'}
    TRANSCRIPT_RETRY_BASE_DELAY_MS: ${env:TRANSCRIPT_RETRY_BASE_DELAY_MS, '500'}
    # 1回の実行でTranscript取得を試みる動画数の上限。429の発生状況を見ながら調整する。
    TRANSCRIPT_BATCH_SIZE: ${env:TRANSCRIPT_BATCH_SIZE, '5'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Scan
          Resource: !GetAtt ProcessedVideosTable.Arn

functions:
  discover:
    handler: src/lambda.handler
    timeout: 60
    memorySize: 256
    events:
      - schedule: rate(6 hours)
  transcriptWorker:
    handler: src/transcriptWorkerLambda.handler
    timeout: 300
    memorySize: 512
    events:
      # 429（アクセス制限）の発生状況を見ながら間隔を調整する。新着検知（6時間ごと）より
      # 短い間隔でPENDING/RETRY_WAIT動画を少しずつ処理する。
      - schedule: rate(30 minutes)

resources:
  Resources:
    ProcessedVideosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PROCESSED_VIDEOS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: videoId
            AttributeType: S
        KeySchema:
          - AttributeName: videoId
            KeyType: HASH

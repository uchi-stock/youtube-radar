service: youtube-radar-pipeline
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1
  # GET /videos/{videoId}をfrontend（CloudFront配信のブラウザアプリ）から直接呼ぶためCORSを有効にする。
  httpApi:
    cors: true
  environment:
    PROCESSED_VIDEOS_TABLE: ${self:service}-${sls:stage}-processed-videos
    # v2: userEmail+channelIdの複合キーへ変更した際、CloudFormationは
    # カスタム名前付きリソースの置き換え（キースキーマ変更）を旧名のままでは
    # 許可しないため、テーブル名を変更した（Issue #100）。
    CHANNELS_TABLE: ${self:service}-${sls:stage}-channels-v2
    YOUTUBE_API_KEY: ${env:YOUTUBE_API_KEY}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
    # channelsApi（POST /channels）がアクセストークンの検証にのみ使用する。
    # discover Lambdaはchannelsストア経由でチャンネル一覧を読むため、
    # OAuthクライアントシークレット・リフレッシュトークンは不要（Issue #96）。
    GOOGLE_OAUTH_CLIENT_ID: ${env:GOOGLE_OAUTH_CLIENT_ID}
    LINE_CHANNEL_ACCESS_TOKEN: ${env:LINE_CHANNEL_ACCESS_TOKEN, ''}
    LINE_USER_ID: ${env:LINE_USER_ID, ''}
    # 1回の実行でTranscript取得を試みる動画数の上限。
    TRANSCRIPT_BATCH_SIZE: ${env:TRANSCRIPT_BATCH_SIZE, '5'}
    # 自宅Raspberry PiからのAPI呼び出しを認証する共有シークレット。
    PI_API_KEY: ${env:PI_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Scan
          Resource: !GetAtt ProcessedVideosTable.Arn
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
          Resource: !GetAtt ChannelsTable.Arn

functions:
  discover:
    handler: src/lambda.handler
    # 126チャンネル分のYouTube Data API呼び出し・DynamoDB参照を逐次実行するため、
    # 60秒では不足しタイムアウトすることが実機で確認された（Issue #38）。
    timeout: 300
    memorySize: 256
    events:
      - schedule: rate(6 hours)
  # 字幕取得自体はAWSからは行わない（HTTP 429で恒常的にブロックされるため）。
  # 自宅Raspberry Piが本APIを介して未処理動画一覧を取得し、字幕取得結果を送信する。
  transcriptApi:
    handler: src/transcriptApiLambda.handler
    timeout: 30
    memorySize: 256
    events:
      - httpApi:
          method: GET
          path: /pending
      - httpApi:
          method: POST
          path: /transcripts
      # frontendがブラウザから直接呼ぶ読み取り専用の公開エンドポイント（cors設定はprovider.httpApi参照）。
      - httpApi:
          method: GET
          path: /videos/{videoId}
      # 動画一覧画面でのタグ絞り込み用に、複数動画の処理状態・タグをまとめて取得する
      # （?ids=v1,v2,v3）。上と同様、認証不要の読み取り専用公開エンドポイント。
      - httpApi:
          method: GET
          path: /videos
  # frontendがログイン時に取得した登録チャンネル一覧を受け取り、DynamoDBへ永続化する。
  # discover Lambdaはこのテーブルから処理する。
  channelsApi:
    handler: src/channelsApiLambda.handler
    timeout: 30
    memorySize: 256
    events:
      - httpApi:
          method: POST
          path: /channels
  # 運用監視（サイレント障害検知、Issue #122）用のopsAlert Lambdaは、デプロイ用IAM
  # ユーザーにSNS関連の権限が無くdeploy-backendが継続的に失敗するため、IAM権限対応まで
  # 一時的に無効化している（Issue #129）。src/opsAlertLambda.js・共有コードのsymlink
  # （src/opsAlertNotifier.js）・関連テストはコードとして残しており、IAM権限対応後は
  # 以下のコメントアウトとresourcesのOpsAlertTopic・TranscriptApiNoInvocationsAlarmの
  # コメントアウトを解除するだけで再度有効化できる。
  # opsAlert:
  #   handler: src/opsAlertLambda.handler
  #   timeout: 30
  #   memorySize: 128
  #   environment:
  #     OPS_ALERT_LINE_CHANNEL_ACCESS_TOKEN: ${env:OPS_ALERT_LINE_CHANNEL_ACCESS_TOKEN, ''}
  #     OPS_ALERT_LINE_USER_ID: ${env:OPS_ALERT_LINE_USER_ID, ''}
  #   events:
  #     - sns:
  #         arn: !Ref OpsAlertTopic
  #         topicName: ${self:service}-${sls:stage}-ops-alert

resources:
  Resources:
    ProcessedVideosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PROCESSED_VIDEOS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: videoId
            AttributeType: S
        KeySchema:
          - AttributeName: videoId
            KeyType: HASH
    ChannelsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CHANNELS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userEmail
            AttributeType: S
          - AttributeName: channelId
            AttributeType: S
        KeySchema:
          - AttributeName: userEmail
            KeyType: HASH
          - AttributeName: channelId
            KeyType: RANGE
    # デプロイ用IAMユーザーにSNS関連の権限が無くdeploy-backendが継続的に失敗するため、
    # IAM権限対応まで一時的に無効化している（Issue #129。詳細はfunctions.opsAlertの
    # コメント参照）。
    # OpsAlertTopic:
    #   Type: AWS::SNS::Topic
    #   Properties:
    #     TopicName: ${self:service}-${sls:stage}-ops-alert
    # # Raspberry Piが完全に停止・クラッシュした場合、transcriptApi Lambda（GET /pending）は
    # # 一切呼び出されなくなるが、通常のエラーログ監視では検知できない（Issue #122）。
    # # 想定実行間隔（cronで10分ごと）に対して十分な余裕を持たせたPeriod・EvaluationPeriodsで
    # # 「一定時間以上呼び出しが無い」こと自体を異常とみなす（TreatMissingData: breaching）。
    # TranscriptApiNoInvocationsAlarm:
    #   Type: AWS::CloudWatch::Alarm
    #   Properties:
    #     AlarmName: ${self:service}-${sls:stage}-transcriptApi-no-invocations
    #     Namespace: AWS/Lambda
    #     MetricName: Invocations
    #     Dimensions:
    #       - Name: FunctionName
    #         Value: ${self:service}-${sls:stage}-transcriptApi
    #     Statistic: Sum
    #     Period: 3600
    #     EvaluationPeriods: 1
    #     Threshold: 1
    #     ComparisonOperator: LessThanThreshold
    #     TreatMissingData: breaching
    #     AlarmActions:
    #       - !Ref OpsAlertTopic
    #     OKActions:
    #       - !Ref OpsAlertTopic
